<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>오늘 뭐 먹지?</h1>
        <div class="card">
            <div id="menu-display" class="menu-display">
                <p>무엇을 먹을지 고민될 때 버튼을 눌러주세요!</p>
            </div>
            <button id="recommend-btn">
                <i class="fa-solid fa-utensils"></i> 메뉴 추천받기
            </button>
        </div>

        <div class="card">
            <h2>새로운 메뉴 추가</h2>
            <div class="add-menu-form">
                <input type="text" id="new-menu-input" placeholder="새로운 메뉴를 입력하세요">
                <button id="add-menu-btn">
                    <i class="fa-solid fa-plus"></i> 추가
                </button>
            </div>
        </div>
    </div>
    <script src="main.js" defer></script>
</body>
</html>
