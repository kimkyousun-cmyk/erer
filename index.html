<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘 뭐 먹지? · 스마트 메뉴 추천</title>
  <meta name="description" content="빠르게 오늘의 메뉴를 추천하고, 태그 필터/랜덤 뽑기/투표/즐겨찾기까지 한 번에." />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <meta property="og:title" content="오늘 뭐 먹지? · 스마트 메뉴 추천" />
  <meta property="og:description" content="태그 기반 추천 + 랜덤 뽑기 + 투표까지 되는 메뉴 추천 사이트" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="topbar">
    <div class="logo">오늘 뭐 먹지?</div>
    <nav class="nav">
      <a href="#recommend">추천</a>
      <a href="#list">목록</a>
      <a href="#add">추가</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero" id="recommend">
      <div>
        <div class="eyebrow">빠른 결정</div>
        <h1>오늘의 한 끼, <span>10초 안에</span> 결정하세요</h1>
        <p>태그 필터, 랜덤 추천, 득표순 정렬까지. 메뉴 고민 끝.</p>
        <div class="hero-actions">
          <button class="button" data-action="pick">랜덤 추천</button>
          <button class="button ghost" data-action="surprise">오늘의 깜짝 메뉴</button>
        </div>
      </div>
      <div class="card highlight" data-recommend-card>
        <div class="tag-row" data-recommend-tags></div>
        <h2 data-recommend-title>랜덤 추천을 눌러주세요</h2>
        <p data-recommend-desc>기분에 맞는 메뉴를 바로 추천해드립니다.</p>
        <div class="meta" data-recommend-meta></div>
        <div class="vote-row">
          <button class="chip" data-vote="up">먹고싶다 👍</button>
          <button class="chip" data-vote="down">별로야 👎</button>
          <button class="chip" data-favorite>즐겨찾기 ⭐</button>
        </div>
      </div>
    </section>

    <section class="panel" id="filters">
      <h2>필터</h2>
      <div class="filter-row">
        <input type="search" placeholder="메뉴 검색" data-search />
        <button class="button ghost" data-clear>초기화</button>
      </div>
      <div class="tag-cloud" data-tags></div>
      <div class="toggle-row">
        <label><input type="checkbox" data-only-favorite /> 즐겨찾기만 보기</label>
        <label><input type="checkbox" data-only-quick /> 15분 이내 메뉴</label>
      </div>
    </section>

    <section id="list">
      <div class="section-head">
        <h2>메뉴 목록</h2>
        <div class="sort-row">
          <button class="chip" data-sort="popular">인기순</button>
          <button class="chip" data-sort="quick">빠른 순</button>
          <button class="chip" data-sort="random">랜덤</button>
        </div>
      </div>
      <div class="grid" data-list></div>
    </section>

    <section class="panel" id="add">
      <h2>메뉴 추가</h2>
      <p>직접 메뉴를 추가해 나만의 추천 목록을 만들 수 있어요.</p>
      <form class="form" data-add-form>
        <input name="name" placeholder="메뉴 이름" required />
        <input name="desc" placeholder="설명 (예: 매콤, 든든)" required />
        <input name="tags" placeholder="태그 (쉼표로 구분)" required />
        <input name="time" type="number" min="5" max="120" placeholder="조리 시간(분)" required />
        <button class="button" type="submit">추가하기</button>
      </form>
      <div class="notice" data-add-msg></div>
    </section>
  </main>

  <footer class="footer">
    <div>오늘 뭐 먹지? · 스마트 메뉴 추천</div>
    <div><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></div>
  </footer>

  <script src="/main.js" defer></script>
</body>
</html>
